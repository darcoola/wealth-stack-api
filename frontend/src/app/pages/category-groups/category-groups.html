<h1 class="page-title">Groups</h1>
<p class="page-subtitle">Manage the groupings your categories are bucketed into for reporting.</p>

@if (error()) {
  <div class="error-banner" role="alert">
    <i class="pi pi-exclamation-triangle"></i>
    <span>{{ error() }}</span>
  </div>
}

<div class="add-row">
  <input
    pInputText
    type="text"
    placeholder="New group name"
    [ngModel]="newName()"
    (ngModelChange)="newName.set($event)"
    (keyup.enter)="add()" />
  <p-button label="Add" icon="pi pi-plus" (onClick)="add()" [disabled]="!newName().trim()" />
</div>

<p-table
  [value]="groups()"
  [loading]="loading()"
  sortField="name"
  [sortOrder]="1"
  styleClass="p-datatable-sm"
  dataKey="id">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-group>
    <tr>
      <td [pEditableColumn]="group.name" pEditableColumnField="name">
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input
              pInputText
              type="text"
              [ngModel]="group.name"
              (ngModelChange)="group.name = $event"
              (blur)="rename(group, group.name)"
              (keyup.enter)="rename(group, group.name)" />
          </ng-template>
          <ng-template pTemplate="output">
            <span class="editable-name">{{ group.name }}</span>
          </ng-template>
        </p-cellEditor>
      </td>
      <td class="text-right">
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          ariaLabel="Delete group"
          (onClick)="remove(group)" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="2" class="empty-cell">
        @if (!loading()) {
          No groups yet. Add one above to get started.
        }
      </td>
    </tr>
  </ng-template>
</p-table>
