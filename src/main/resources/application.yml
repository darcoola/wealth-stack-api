spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wealthstack
    driver-class-name: org.postgresql.Driver
    username: wealthstack
    password: wealthstack
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
