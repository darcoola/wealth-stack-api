# Production profile: every environment-specific value comes from an env var (see .env.prod.example).
# Activated with SPRING_PROFILES_ACTIVE=prod; the base application.yml keeps its localhost defaults
# for dev, and this file overrides them.
spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    elasticsearch:
        uris: ${ELASTICSEARCH_URIS}
    security:
        oauth2:
            resourceserver:
                jwt:
                    # The `iss` claim the SPA's tokens will carry — Keycloak's public URL, since
                    # that is where the browser obtained them.
                    issuer-uri: ${KEYCLOAK_ISSUER_URI}
                    # Keys are fetched over the internal Docker network instead of looping back out
                    # through the public hostname (which would depend on NAT hairpinning). Setting
                    # this explicitly also means no OIDC discovery call at startup, so the app no
                    # longer needs Keycloak to be up before it can boot.
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

server:
    port: 8088
    # Behind Caddy: trust X-Forwarded-* so the app sees the original https scheme and host.
    forward-headers-strategy: framework

wealthstack:
    auth:
        # Public Keycloak URL handed to keycloak-js by /api/v1/public/auth-config.
        url: ${WEALTHSTACK_AUTH_URL}
        realm: wealthstack
        client-id: wealthstack-web
    bootstrap:
        owner-email: ${WEALTHSTACK_OWNER_EMAIL:}

logging:
    level:
        root: INFO
        com.wealthStack: INFO
