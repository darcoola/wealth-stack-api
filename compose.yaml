services:
  postgres:
    image: postgres:17-alpine
    container_name: wealthstack-postgres
    environment:
      POSTGRES_DB: wealthstack
      POSTGRES_USER: wealthstack
      POSTGRES_PASSWORD: wealthstack
    ports:
      - "5432:5432"
    volumes:
      - wealthstack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthstack -d wealthstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: wealthstack-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - wealthstack-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: wealthstack-keycloak
    command: start-dev --import-realm --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Substituted into keycloak/realm-wealthstack.json on import; Google login
      # simply fails with the placeholders until real credentials are provided.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      # Also substituted into the realm: the SPA's origin, added to the client's redirect /
      # post-logout URIs. Locally that is just the app itself; compose.prod.yml sets the public
      # https host instead, which is what makes the same realm file work in production.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    ports:
      - "8081:8081"
    volumes:
      # Realm is re-imported on every start; dev Keycloak state is ephemeral on purpose
      # (the seeded dev user already has the wealthstack-user role).
      - ./keycloak:/opt/keycloak/data/import

volumes:
  wealthstack-postgres-data:
  wealthstack-es-data:
